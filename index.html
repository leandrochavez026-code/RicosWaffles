
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riquísimos Waffles</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="encabezado">
        <h1>Riquísimos Waffles</h1>
        <p>Un pequeño momento de dulzura.</p>
    </header>

    <main>

        <section class="productos">
            <h2 class="titulo-seccion">Nuestro menú</h2>

            <div id="contenedor-productos" class="contenedor-productos">
                <!-- Los productos se generan desde script.js -->
            </div>
        </section>

        <section class="pedido" id="pedido">
            <h2 class="titulo-seccion">Realiza tu pedido</h2>

            <div class="formulario">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required>

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" placeholder="Tu apellido" required>

                <label for="detalles">Detalles del pedido</label>
                <textarea id="detalles" placeholder="¿Alguna indicación adicional?"></textarea>

                <div class="resumen">
                    <h3>Tu pedido</h3>
                    <div id="resumen-pedido">
                        <p class="vacio">Todavía no has agregado productos.</p>
                    </div>
                    <p id="total">Total: Q0.00</p>
                </div>

                <button id="enviar-pedido" class="boton">
                    Enviar pedido por WhatsApp
                </button>

            </div>
        </section>

    </main>

    <footer>
        <p>Riquísimos Waffles © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
